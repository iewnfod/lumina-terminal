name: Release

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish-tauri:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            args: "--target x86_64-unknown-linux-gnu"
          - platform: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            args: "--target aarch64-unknown-linux-gnu"
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            args: "--target x86_64-pc-windows-msvc"
          - platform: macos-latest
            target: aarch64-apple-darwin
            args: "--target aarch64-apple-darwin"
          - platform: macos-latest
            target: x86_64-apple-darwin
            args: "--target x86_64-apple-darwin"

    runs-on: ${{ matrix.platform }}
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            xdg-utils

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      # Snapshot the hand-written release title and body BEFORE tauri-action
      # runs. We feed them straight back to tauri-action (releaseName /
      # releaseBody) so whatever it writes back is identical to what we read —
      # the notes you wrote in the GitHub UI are preserved, and latest.json's
      # `notes` field (which tauri-action reads from this release body) carries
      # the same text. Reading is idempotent across the concurrent matrix jobs
      # since every job re-reads the same values up front.
      - name: Read existing release title and notes
        id: release_meta
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Force bash on every OS: the command substitution + heredoc below are
        # bash syntax, which the Windows runner's default shell (PowerShell) can't run.
        shell: bash
        run: |
          # title (single line) → steps.release_meta.outputs.name
          name="$(gh release view '${{ github.ref_name }}' --json name --jq '.name')"
          # body (multiline) → steps.release_meta.outputs.body
          body="$(gh release view '${{ github.ref_name }}' --json body --jq '.body')"
          {
            echo "name=$name"
            # multiline value: use the delimiter form so newlines survive
            echo "body<<BODY_EOF"
            echo "$body"
            echo "BODY_EOF"
          } >> "$GITHUB_OUTPUT"

      # Publishes signed updater bundles (.tar.gz / .nsis + .sig) and the
      # `latest.json` manifest the Tauri updater downloads. The signing key
      # comes from repo secrets (see docs/UPDATES.md).
      - name: Build tauri app and upload artifacts
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          # Echo back the exact title/notes we snapshotted above so the action's
          # internal release update is a no-op on metadata — only assets change.
          releaseName: ${{ steps.release_meta.outputs.name }}
          releaseBody: ${{ steps.release_meta.outputs.body }}
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

  # After the entire build matrix uploads its .deb artifacts, fire the AUR
  # publish workflow. We can't rely on `release: published` for that one
  # because the assets aren't uploaded yet when the release goes live, and
  # polling is ugly. This job is the clean hand-off: by the time it runs,
  # every arch's .deb is already on the release.
  #
  # We use a `repository_dispatch` event rather than `gh workflow run`
  # because the latter requires a PAT/App token (the default GITHUB_TOKEN is
  # blocked from spawning new workflow runs). A dispatch event is allowed
  # with the built-in GITHUB_TOKEN — no extra secret to manage. The AUR
  # workflow listens on `repository_dispatch` type `publish-aur` and reads
  # the tag from `client_payload.tag`. It runs on the default branch, so it
  # always uses the latest workflow code.
  trigger-aur:
    needs: publish-tauri
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      # repository_dispatch POST requires actions: write on the token.
      actions: write
    steps:
      - name: Trigger Publish to AUR workflow
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Fire repository_dispatch with type `publish-aur`; the tag rides
          # in client_payload. Requires `actions: read` on GITHUB_TOKEN
          # (repo default), which the job already has.
          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            "/repos/${{ github.repository }}/dispatches" \
            -f event_type=publish-aur \
            -f 'client_payload[tag]=${{ github.ref_name }}'
          echo "::notice::Dispatched repository_dispatch(publish-aur) for tag ${{ github.ref_name }}"

name: CI - Frontend

# Verifies the React/TypeScript frontend still type-checks and bundles on
# every commit / PR. This is the lightweight frontend counterpart to
# ci-backend.yml: `pnpm build` runs `tsc && vite build` (type-check + bundle),
# NOT a full `tauri build`, so it stays fast.
#
# Runs on a single OS (ubuntu-latest) on purpose: a Vite/React bundle is
# platform-agnostic, so cross-OS matrix coverage here would only burn minutes
# without catching extra regressions. Platform-specific breakage is the job of
# ci-backend.yml.

# Run on every branch and every PR, not just master — a feature branch should
# be verified before it ever merges.
on:
  push:
  pull_request:

# Merge push and pull_request onto the SAME branch key so the two events (a
# push to a branch and the PR that tracks it) don't run twice for the same
# commit:
#   push          → github.head_ref is empty  → falls back to the branch name
#   pull_request  → github.head_ref is the PR's source branch
# Whichever arrives last wins; the earlier run is cancelled.
concurrency:
  group: ci-frontend-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    name: TypeScript build (tsc + vite)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run frontend unit tests
        run: pnpm test

      # The project's own "build": tsc (strict type-check) + vite build
      # (bundle). If either fails, the frontend does not compile.
      - name: Build frontend
        run: pnpm build

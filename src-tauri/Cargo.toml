[package]
name = "lumina-terminal"
version = "0.2.3"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "lumina_terminal_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.9.0"
tauri-plugin-store = "2.4.3"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-os = "2"
tauri-plugin-log = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-clipboard-manager = "2"
log = "0.4"
base64 = "0.22"
font-kit = "0.14"
clap = { version = "4", features = ["derive"] }
rmcp = { version = "3.1.2", features = ["macros", "server", "transport-streamable-http-server", "schemars"] }
axum = "0.8.9"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net"] }
schemars = "1.2.2"

[dev-dependencies]
# tests/shell_hooks.rs spawns real shells; libc::setsid detaches them from the
# controlling terminal so parallel test shells can't fight the parent terminal.
libc = "0.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
overflow-checks = false
